name: artifact workflow
on: push
env:
  ARTIFACT_NAME: my artifact
jobs:
  job1:
    runs-on: windows-latest
    steps:
    - name: checkout the code
      uses: actions/checkout@v2
    - name: upload the artifact
      uses: actions/upload-artifact@v2
      with:
        name: ${{ ARTIFACT_NAME }}
        path: .
